// Add to the <head> section after the existing styles
<style>
    .voice-button {
        background: #9333ea;
        color: white;
        padding: 12px 24px;
        border-radius: 24px;
        border: none;
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 16px auto;
        cursor: pointer;
    }
    .listening {
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
</style>

// Add just before the closing </header> tag
<button id="voiceButton" class="voice-button">
    <span id="micIcon">🎤</span>
    <span id="voiceButtonText">Talk to Genie</span>
</button>

// Add at the end of the <script> section
let isListening = false;
let recognition;

if ('webkitSpeechRecognition' in window) {
    recognition = new webkitSpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
        isListening = true;
        const voiceButton = document.getElementById('voiceButton');
        voiceButton.classList.add('listening');
        document.getElementById('voiceButtonText').textContent = 'Listening...';
    };

    recognition.onresult = (event) => {
        const command = event.results[0][0].transcript.toLowerCase();
        processVoiceCommand(command);
    };

    recognition.onend = () => {
        isListening = false;
        const voiceButton = document.getElementById('voiceButton');
        voiceButton.classList.remove('listening');
        document.getElementById('voiceButtonText').textContent = 'Talk to Genie';
    };
}

function processVoiceCommand(command) {
    let response = '';
    
    if (command.includes('add task') || command.includes('new task')) {
        const taskText = command.replace(/add task|new task/i, '').trim();
        if (taskText) {
            const task = {
                id: Date.now(),
                text: taskText,
                completed: false
            };
            tasks.push(task);
            saveTasks();
            renderTasks();
            response = `Added task: ${taskText}`;
            showTasks();
        }
    } else if (command.includes('set reminder')) {
        const reminderText = command.replace('set reminder', '').trim();
        document.getElementById('reminderText').value = reminderText;
        showReminders();
        response = 'Please select a time for your reminder';
    } else if (command.includes('show tasks') || command.includes('list tasks')) {
        showTasks();
        response = `You have ${tasks.length} tasks`;
    } else if (command.includes('show reminders')) {
        showReminders();
        response = `You have ${reminders.length} reminders`;
    } else {
        response = "I'm sorry, I didn't understand that command. You can say things like 'add task', 'set reminder', or 'show tasks'.";
    }

    // Speak and show response
    speakResponse(response);
}
