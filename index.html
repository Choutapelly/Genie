<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9333ea">
    <title>Genie - Your Personal Assistant</title>
    <style>
        /* Previous styles remain the same */
        .listening-time {
            color: white;
            font-size: 14px;
            margin-top: 8px;
            opacity: 0.8;
        }
        .pulse-animation {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <!-- Previous HTML remains the same -->
    <script>
        let recognition;
        let listening = false;
        let listenTimeout;
        
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            
            recognition.onstart = () => {
                listening = true;
                voiceButton.classList.add('listening');
                buttonText.textContent = 'Listening...';
                startListeningTimer();
            };
            
            recognition.onend = () => {
                listening = false;
                voiceButton.classList.remove('listening');
                buttonText.textContent = 'Talk to Genie';
                clearTimeout(listenTimeout);
            };
            
            let finalTranscript = '';
            
            recognition.onresult = (event) => {
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }
                
                if (interimTranscript) {
                    showDebug('Hearing: ' + interimTranscript);
                }
                
                if (finalTranscript) {
                    handleCommand(finalTranscript);
                    finalTranscript = '';
                }
                
                // Reset the listening timeout when user is speaking
                if (interimTranscript) {
                    resetListeningTimeout();
                }
            };
        }

        function startListening() {
            try {
                recognition.start();
                setListeningTimeout();
            } catch (error) {
                recognition.stop();
                setTimeout(() => {
                    recognition.start();
                }, 200);
            }
        }

        function setListeningTimeout() {
            listenTimeout = setTimeout(() => {
                if (listening) {
                    recognition.stop();
                }
            }, 7000); // Listen for 7 seconds
        }

        function resetListeningTimeout() {
            clearTimeout(listenTimeout);
            setListeningTimeout();
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                
                // Get available voices
                let voices = speechSynthesis.getVoices();
                
                // Set female voice
                const femaleVoice = voices.find(voice => 
                    voice.name.includes('female') || 
                    voice.name.includes('woman') ||
                    voice.name.includes('girl')
                );
                
                if (femaleVoice) {
                    utterance.voice = femaleVoice;
                }
                
                // Set voice properties
                utterance.pitch = 1.2; // Slightly higher pitch for female voice
                utterance.rate = 1.0; // Normal speed
                utterance.volume = 1.0;
                
                speechSynthesis.speak(utterance);
            }
        }

        // Make sure we get the voices
        if ('speechSynthesis' in window) {
            speechSynthesis.onvoiceschanged = () => {
                speak("Hello! I'm Genie, your personal assistant.");
            };
        }

        // Rest of your existing code...

        voiceButton.addEventListener('click', () => {
            if (!listening) {
                startListening();
            }
        });
    </script>
</body>
</html>
