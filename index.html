<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9333ea">
    <title>Genie - Your Personal Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
        }
        .app {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }
        .header {
            background: #9333ea;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
        }
        .tasks-container {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 16px;
        }
        .task-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #9333ea;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 16px;
        }
        .task-list {
            list-style: none;
        }
        .task-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            gap: 12px;
        }
        .task-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #9333ea;
            border-radius: 4px;
        }
        .task-text {
            flex: 1;
        }
        .task-delete {
            color: red;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
        }
        .task-completed {
            text-decoration: line-through;
            color: #666;
        }
        .tabs {
            display: flex;
            margin-bottom: 16px;
            gap: 8px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab.active {
            background: #9333ea;
            color: white;
        }
        .voice-button {
            background: #9333ea;
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 16px auto;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .listening {
            animation: pulse 1.5s infinite;
            background: #ff4444;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .genie-response {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .debug-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Genie</h1>
            <p>Your Personal Assistant</p>
            <button id="voiceButton" class="voice-button">
                <span id="micIcon">🎤</span>
                <span id="voiceButtonText">Talk to Genie</span>
            </button>
        </header>
        
        <div id="responseArea"></div>

        <div class="tabs">
            <button class="tab active" onclick="showTasks()">Tasks</button>
            <button class="tab" onclick="showReminders()">Reminders</button>
        </div>

        <main class="tasks-container" id="tasksSection">
            <input type="text" class="task-input" placeholder="Add a new task..." id="taskInput" onkeypress="addTaskOnEnter(event)">
            <ul class="task-list" id="taskList"></ul>
        </main>

        <main class="tasks-container" id="remindersSection" style="display: none;">
            <input type="text" class="task-input" placeholder="Reminder text..." id="reminderText">
            <input type="datetime-local" class="task-input" id="reminderTime">
            <button class="tab active" onclick="addReminder()">Set Reminder</button>
            <ul class="task-list" id="reminderList"></ul>
        </main>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
        let reminders = JSON.parse(localStorage.getItem('reminders') || '[]');
        let isListening = false;
        let recognition;

        // Initialize speech recognition
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-IN';

            recognition.onstart = () => {
                isListening = true;
                const voiceButton = document.getElementById('voiceButton');
                voiceButton.classList.add('listening');
                document.getElementById('voiceButtonText').textContent = 'Listening...';
                showResponse("I'm listening...");
            };

            recognition.onresult = (event) => {
                const command = event.results[0][0].transcript.toLowerCase();
                showDebug('Heard: ' + command);
                processVoiceCommand(command);
            };

            recognition.onend = () => {
                isListening = false;
                const voiceButton = document.getElementById('voiceButton');
                voiceButton.classList.remove('listening');
                document.getElementById('voiceButtonText').textContent = 'Talk to Genie';
            };

            recognition.onerror = (event) => {
                showResponse('Error: ' + event.error);
                isListening = false;
                document.getElementById('voiceButton').classList.remove('listening');
                document.getElementById('voiceButtonText').textContent = 'Talk to Genie';
            };
        }

        function processVoiceCommand(command) {
            let response = '';

            if (command.includes('new task')) {
                const taskText = command.replace('new task', '').trim();
                if (taskText) {
                    addTask(taskText);
                    response = `Added task: ${taskText}`;
                    showTasks();
                } else {
                    response = "What task would you like me to set?";
                }
            }
            else if (command.includes('set reminder')) {
                const reminderText = command.replace('set reminder', '').trim();
                if (reminderText) {
                    const timeMatch = command.match(/at (\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);
                    let reminderTime = new Date();
                    
                    if (timeMatch) {
                        let hours = parseInt(timeMatch[1]);
                        const minutes = timeMatch[2] ? parseInt(timeMatch[2]) : 0;
                        const meridiem = timeMatch[3] ? timeMatch[3].toLowerCase() : null;
                        
                        if (meridiem === 'pm' && hours < 12) hours += 12;
                        if (meridiem === 'am' && hours === 12) hours = 0;
                        
                        reminderTime.setHours(hours, minutes, 0);
                        
                        if (command.includes('tomorrow')) {
                            reminderTime.setDate(reminderTime.getDate() + 1);
                        }
                        
                        addReminder(reminderText, reminderTime);
                        response = `Set reminder for ${reminderTime.toLocaleString()}: ${reminderText}`;
                    } else {
                        document.getElementById('reminderText').value = reminderText;
                        showReminders();
                        response = 'Please select a time for your reminder';
                    }
                } else {
                    response = "What would you like me to remind you about?";
                }
            }
            else if (command.includes('show tasks')) {
                showTasks();
                response = `You have ${tasks.length} tasks`;
            }
            else if (command.includes('show reminders')) {
                showReminders();
                response = `You have ${reminders.length} reminders`;
            }
            else {
                response = "I didn't understand. Try saying 'new task', 'set reminder', or 'show tasks'";
            }

            showResponse(response);
            speakResponse(response);
        }

        function showResponse(text) {
            const responseArea = document.getElementById('responseArea');
            const response = document.createElement('div');
            response.className = 'genie-response';
            response.textContent = text;
            responseArea.insertBefore(response, responseArea.firstChild);
            setTimeout(() => response.remove(), 5000);
        }

        function showDebug(text) {
            console.log('Debug:', text);
        }

        function speakResponse(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                speechSynthesis.speak(utterance);
            }
        }

        function addTask(text) {
            if (text.trim()) {
                tasks.push({
                    id: Date.now(),
                    text: text.trim(),
                    completed: false
                });
                saveTasks();
                renderTasks();
                return true;
            }
            return false;
        }

        function addTaskOnEnter(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('taskInput');
                if (addTask(input.value)) {
                    input.value = '';
                }
            }
        }

        function addReminder(text, time) {
            const reminder = {
                id: Date.now(),
                text: text,
                time: time.toISOString(),
                notified: false
            };
            reminders.push(reminder);
            saveReminders();
            renderReminders();
            showReminders();
        }

        function toggleTask(id) {
            tasks = tasks.map(task => 
                task.id === id ? {...task, completed: !task.completed} : task
            );
            saveTasks();
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
            renderTasks();
        }

        function deleteReminder(id) {
            reminders = reminders.filter(reminder => reminder.id !== id);
            saveReminders();
            renderReminders();
        }

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function saveReminders() {
            localStorage.setItem('reminders', JSON.stringify(reminders));
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = tasks.map(task => `
                <li class="task-item">
                    <input type="checkbox" 
                           class="task-checkbox" 
                           ${task.completed ? 'checked' : ''}
                           onclick="toggleTask(${task.id})">
                    <span class="task-text ${task.completed ? 'task-completed' : ''}">${task.text}</span>
                    <button class="task-delete" onclick="deleteTask(${task.id})">×</button>
                </li>
            `).join('');
        }

        function renderReminders() {
            const reminderList = document.getElementById('reminderList');
            reminderList.innerHTML = reminders.map(reminder => `
                <li class="task-item">
                    <span class="task-text">
                        ${reminder.text}<br>
                        <small>${new Date(reminder.time).toLocaleString()}</small>
                    </span>
                    <button class="task-delete" onclick="deleteReminder(${reminder.id})">×</button>
                </li>
            `).join('');
        }

        function showTasks() {
            document.getElementById('tasksSection').style.display = 'block';
            document.getElementById('remindersSection').style.display = 'none';
            document.querySelectorAll('.tab').forEach((tab, index) => {
                tab.classList.toggle('active', index === 0);
            });
        }

        function showReminders() {
            document.getElementById('tasksSection').style.display = 'none';
            document.getElementById('remindersSection').style.display = 'block';
            document.querySelectorAll('.tab').forEach((tab, index) => {
                tab.classList.toggle('active', index === 1);
            });
        }

        document.getElementById('voiceButton').addEventListener('click', () => {
            if (!isListening && recognition) {
                recognition.start();
            }
        });

        // Request notification permission
        if ('Notification' in window) {
            Notification.requestPermission();
        }

        // Initialize
        renderTasks();
        renderReminders();
        
        // Check reminders every minute
        setInterval(() => {
            const now = new Date();
            reminders.forEach(reminder => {
                if (!reminder.notified && new Date(reminder.time) <= now) {
                    if (Notification.permission === 'granted') {
                        new Notification('Reminder: ' + reminder.text);
                    }
                    reminder.notified = true;
                    showResponse('Reminder: ' + reminder.text);
                }
            });
            saveReminders();
        }, 60000);
    </script>
</body>
</html>
